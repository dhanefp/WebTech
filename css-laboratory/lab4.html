<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4 - The CSS Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>The CSS Box Model</h1>

    <div class="card">
        <h2>Content</h2>
        <p>The content is the innermost part of the box, where text and images appear.</p>
    </div>

    <div class="card">
        <h2>Padding</h2>
        <p>Padding is the space between the content and the border. It sits inside the box.</p>
    </div>

    <div class="card">
        <h2>Margin</h2>
        <p>Margin is the space outside the border that separates one box from another.</p>
    </div>
</body>
</html>
