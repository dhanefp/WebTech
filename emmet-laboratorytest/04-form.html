  <h1>Student Registration Form</h1>
  <p>Every input has a label linked to it, so clicking the label focuses the field.</p>
  <p class="abbr"><span>Emmet abbreviation</span><code>form&gt;(p&gt;label+input)*8</code></p>
  <form class="demo" action="#">
    <p><label for="student-id">Student ID</label><input type="text" id="student-id" name="student-id"></p>
    <p><label for="full-name">Full Name</label><input type="text" id="full-name" name="full-name"></p>
    <p><label for="email">Email</label><input type="email" id="email" name="email"></p>
    <p><label for="password">Password</label><input type="password" id="password" name="password"></p>
    <fieldset>
      <legend>Gender</legend>
      <label><input type="radio" name="gender" value="male"> Male</label>
      <label><input type="radio" name="gender" value="female"> Female</label>
    </fieldset>
    <p>
      <label for="course">Course</label>
      <select id="course" name="course">
        <option>BSIT</option>
        <option>BSCS</option>
        <option>BSIS</option>
      </select>
    </p>
    <fieldset>
      <legend>Hobbies</legend>
      <label><input type="checkbox" name="hobbies" value="reading"> Reading</label>
      <label><input type="checkbox" name="hobbies" value="gaming"> Gaming</label>
      <label><input type="checkbox" name="hobbies" value="music"> Music</label>
    </fieldset>
    <p><label for="address">Address</label><textarea id="address" name="address" rows="3"></textarea></p>
    <input type="submit" value="Submit">
  </form>

    <a href="05-semantic.html">05 Semantic &rarr;</a>
